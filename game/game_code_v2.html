<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora-7 · Astro Cognitive Escape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<!--
  ============================================================
  AURORA-7 · ASTRO COGNITIVE ESCAPE  (moduł do aplikacji zdrowotnej astronautów)
  ------------------------------------------------------------
  INTEGRACJA Z TWOJĄ APLIKACJĄ HTML:
   1. <link> z czcionkami + blok <style id="ac-style"> -> do <head>
   2. <div id="astro-cognition-game"></div>           -> miejsce gry
   3. blok <script id="ac-script">                    -> na koniec <body>

  API (window.AstroCognition):
    .getSessions()   wszystkie sesje (surowe dane)
    .getRanking()    ranking astronautów (średnia 3 ostatnich sesji + trend vs baza)
    .duckFor(score, deltaPct, streakDays)  id kaczki dla wyniku (getRanking() zwraca też pole .duck)
    .getOrders() / .getRewards() / .setRewards([...]) / .onOrder(cb)  nagrody fizyczne i zamówienia (zdarzenie 'astro:reward-ordered')
    .setRequiredMeasurements(['hr','spo2'])  dodatkowe pomiary wymagane, by odblokować planety (hr, hrv, spo2, temp)
    .exportJSON() / .exportCSV()   (sesje zawierają też s.eye: moduł Wzrok / eye tracking, wymaga kamery)
    .onSaved(cb)     callback po zapisaniu sesji
  Zdarzenie DOM:  window.addEventListener('astro:session-saved', e => e.detail)
  Dane: localStorage["astro.escape.v2"] = { sessions:[...], profiles:{...} }
  ============================================================
-->
<style id="ac-style">
.ac-root{--acc:#7dd3fc;--acc2:#c084fc;--g1:rgba(192,132,252,.28);--g2:rgba(56,189,248,.22);--bg:#050816;--panel:rgba(16,22,52,.62);--line:rgba(125,211,252,.22);--txt:#e8ecff;--mut:#97a3d6;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;

  background:radial-gradient(1100px 600px at 85% -10%,var(--g1),transparent 60%),radial-gradient(900px 500px at -10% 110%,var(--g2),transparent 60%),var(--bg);
  border:1px solid var(--line);border-radius:20px;max-width:900px;margin:16px auto;box-shadow:0 0 70px var(--g1),inset 0 0 80px rgba(56,189,248,.04)}
.ac-root[data-theme=mars]{--acc:#fb923c;--acc2:#f43f5e;--g1:rgba(244,63,94,.26);--g2:rgba(251,146,60,.2);--line:rgba(251,146,60,.28)}
.ac-root[data-theme=aurora]{--acc:#4ade80;--acc2:#22d3ee;--g1:rgba(34,211,238,.22);--g2:rgba(74,222,128,.2);--line:rgba(74,222,128,.26)}
.ac-root[data-theme=void]{--acc:#e5e7eb;--acc2:#94a3b8;--g1:rgba(148,163,184,.18);--g2:rgba(100,116,139,.15);--line:rgba(203,213,225,.22);--bg:#020203}
.ac-root *{box-sizing:border-box}
.ac-bg{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.ac-wrap{position:relative;z-index:1;padding:20px}
.ac-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ac-title{font-family:Orbitron,sans-serif;font-weight:900;font-size:1.25rem;letter-spacing:.12em;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ac-title small{display:block;font:400 .68rem 'Exo 2',sans-serif;letter-spacing:.25em;color:var(--mut);-webkit-text-fill-color:var(--mut)}
.ac-chips{display:flex;gap:8px;align-items:center}
.ac-chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:.85rem;white-space:nowrap}
.ac-chip b{color:var(--warn)}
.ac-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.ac-tab,.ac-btn{font:600 .92rem 'Exo 2',sans-serif;color:var(--txt);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 15px;cursor:pointer;transition:.15s}
.ac-tab:hover,.ac-btn:hover{border-color:var(--acc);box-shadow:0 0 14px var(--g2)}
.ac-tab.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#05101f;border-color:transparent}
.ac-btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#05101f;border-color:transparent;font-weight:700}
.ac-btn.ghost{background:transparent}

.ac-card{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}

.ac-big{font:900 2.8rem Orbitron,sans-serif;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ac-table{width:100%;border-collapse:collapse;font-size:.86rem}
.ac-table th,.ac-table td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.ac-table th{color:var(--mut);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
.ac-table tr.sel{background:rgba(125,211,252,.08)} .ac-table tbody tr{cursor:pointer}
.ac-good{color:var(--ok)}.ac-bad{color:var(--bad)}.ac-flag{color:var(--warn)}
.ac-shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ac-item{background:rgba(5,8,22,.55);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}

<body style="margin:0;background:#02030a;padding:8px">

<div id="astro-cognition-game"></div>

<script id="ac-script">
(function () {
  'use strict';
  const KEY = 'astro.escape.v2', LAST_KEY = 'astro.escape.lastUser', SND_KEY = 'astro.escape.sound';
  const listeners = [];

  /* ================= helpers ================= */
  const $ = (s, r) => (r || document).querySelector(s);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
  const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
  const median = a => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i);[a[i], a[j]] = [a[j], a[i]]; } return a; };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const now = () => performance.now();
  const dayKey = ts => new Date(ts).toLocaleDateString('sv-SE');

  /* ================= storage ================= */
  function loadDB() { try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.sessions)) { d.profiles = d.profiles || {}; return d; } } catch (e) { } return { sessions: [], profiles: {} }; }
  const DB = loadDB(); DB.orders = DB.orders || [];
  const saveDB = () => { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { } };
  function profile(name) {
    if (!DB.profiles[name]) DB.profiles[name] = { credits: 100, inv: { shield: 1, slowmo: 0, life: 1, hint: 2 }, owned: ['skin:classic', 'trail:flame', 'theme:nebula'], skin: 'classic', trail: 'flame', theme: 'nebula', ach: [] };
    return DB.profiles[name];
  }
  const getSessions = () => DB.sessions;
  function addSession(s) {
    DB.sessions.push(s); saveDB();
    listeners.forEach(cb => { try { cb(s); } catch (e) { console.error(e); } });
    window.dispatchEvent(new CustomEvent('astro:session-saved', { detail: s }));
  }

  /* ================= NAGRODY FIZYCZNE (zamówienia realizowane przez koordynatora) =================
     Astronauta wymienia kredyty na nagrodę -> powstaje zamówienie (status 'pending').
     Koordynator (panel „Koordynator”, PIN) oznacza je jako zrealizowane (dla kodów wpisuje kod) albo anuluje ze zwrotem kredytów.
     API: AstroCognition.getOrders(), .onOrder(cb), .getRewards(), .setRewards([...]);  zdarzenie: 'astro:reward-ordered' / 'astro:reward-updated'.
     Pozycja: { id, icon, name, price, type:'phys'|'code', stock:null|liczba } */
  const MAX_PENDING = 3, orderListeners = [];
  const DEFAULT_REWARDS = [

  /* ================= DANE Z MODUŁU POMIAROWEGO (vitals) =================
     Osobny moduł Twojej aplikacji może przekazać pomiary na 3 sposoby:
       1) AstroCognition.setVitals({ hr:72, hrv:45, spo2:98, temp:36.7, sleepHours:6, stress:2, fatigue:3, mood:4 })
       2) window.dispatchEvent(new CustomEvent('astro:vitals', { detail: { ... } }))
       3) localStorage['astro.vitals'] = JSON.stringify({ ... })   (odczyt przy starcie misji)
     hr = tętno spoczynkowe [bpm], hrv = RMSSD [ms], spo2 [%], temp [°C], stress/fatigue/mood = skala 1–5.
     Wszystkie pola są opcjonalne. Progi w kodzie to proste heurystyki, nie diagnoza medyczna. */
  const VKEY = 'astro.vitals', vitalsHooks = [];

  const num = x => (x === null || x === undefined || x === '' || isNaN(+x)) ? null : +x;
  function readVitals() { try { const v = JSON.parse(localStorage.getItem(VKEY)); if (v && typeof v === 'object') VITALS = Object.assign({}, VITALS, v); } catch (e) { } return VITALS; }
  function setVitals(v) {
    if (!v || typeof v !== 'object') return VITALS;
    VITALS = Object.assign({}, VITALS, v, { ts: Date.now(), _t: Object.assign({}, VITALS._t, Object.fromEntries(Object.keys(v).filter(k => k !== 'ts' && k !== '_t').map(k => [k, Date.now()]))) });
    try { localStorage.setItem(VKEY, JSON.stringify(VITALS)); } catch (e) { }
    vitalsHooks.forEach(f => f(VITALS)); return VITALS;
  }
  window.addEventListener('astro:vitals', e => setVitals(e.detail));
  window.addEventListener('storage', e => { if (e.key === VKEY) { readVitals(); vitalsHooks.forEach(f => f(VITALS)); } });
  readVitals();

  /* Wymagane pomiary: dopóki nie są wykonane, planety w kosmosie są zablokowane (pole siłowe).
     Zawsze wymagany jest skan samopoczucia na stacji. Dodatkowo aplikacja może wymagać pomiarów z modułu pomiarowego:
       AstroCognition.setRequiredMeasurements(['hr','spo2'])   // dostępne: hr, hrv, spo2, temp (ważne 24 h)
     Jeśli pomiar nie przyszedł z modułu, astronauta może wpisać go ręcznie na stacji. */
  const REQ_KEY = 'astro.escape.req';
  const VITAL_FIELDS = { hr: { label: 'Tętno spoczynkowe (bpm)', min: 30, max: 220, step: 1 }, hrv: { label: 'HRV RMSSD (ms)', min: 1, max: 300, step: 1 }, spo2: { label: 'Saturacja SpO₂ (%)', min: 70, max: 100, step: 1 }, temp: { label: 'Temperatura ciała (°C)', min: 34, max: 42, step: .1 } };
  let REQ = (() => { try { const a = JSON.parse(localStorage.getItem(REQ_KEY)); return Array.isArray(a) ? a.filter(k => VITAL_FIELDS[k]) : []; } catch (e) { return []; } })();
  function setRequiredMeasurements(a) { REQ = (Array.isArray(a) ? a : []).filter(k => VITAL_FIELDS[k]); try { localStorage.setItem(REQ_KEY, JSON.stringify(REQ)); } catch (e) { } return REQ; }
  function vitalOK(k) { const t = (VITALS._t && VITALS._t[k]) || VITALS.ts; return !!t && Date.now() - t < 864e5 && num(VITALS[k]) !== null; }

  function vitalsFlags(v) {
    const hr = num(v.hr), hrv = num(v.hrv), spo2 = num(v.spo2), temp = num(v.temp), warnings = [];
    if (spo2 !== null && spo2 < 90) warnings.push(['bad', `SpO₂ ${spo2}% jest krytycznie niskie. Skontaktuj się z lekarzem pokładowym.`]);
    else if (spo2 !== null && spo2 < 94) warnings.push(['warn', `SpO₂ ${spo2}% jest poniżej normy. Rozważ konsultację z lekarzem pokładowym przed intensywnymi zadaniami.`]);
    if (temp !== null && temp >= 38) warnings.push(['bad', `Temperatura ${temp}°C: możliwa gorączka, zgłoś lekarzowi pokładowemu.`]);
    else if (temp !== null && temp >= 37.5) warnings.push(['warn', `Temperatura ${temp}°C jest podwyższona.`]);
    if (hr !== null && hr > 100) warnings.push(['warn', `Tętno spoczynkowe ${hr} bpm jest podwyższone.`]);
    return { warnings, physioStress: (hr !== null && hr > 100) || (hrv !== null && hrv < 20) };
  }
  // domeny, w których ostatni wynik spadł o 15+ pkt względem średniej z poprzednich sesji
  function weakDomains(user) {
    const ss = DB.sessions.filter(s => s.astronaut === user).sort((a, b) => a.ts - b.ts);
    if (ss.length < 2) return [];
    const last = ss[ss.length - 1], prev = ss.slice(0, -1);
    return DOMAINS.filter(([k]) => last[k] && last[k].score < mean(prev.filter(x => x[k]).map(x => x[k].score)) - 15).map(d => d[0]);
  }
  // Dobór misji do aktualnych pomiarów, samopoczucia i historii wyników
  function planMission(user, checkin) {
    const f = vitalsFlags(Object.assign({}, VITALS)), reasons = [], dn = Object.fromEntries(DOMAINS);
    const stress = Math.max(checkin.stress, f.physioStress ? 4 : 0);
    const fatigue = Math.max(checkin.fatigue, checkin.sleep < 5 ? 4 : checkin.sleep < 6 ? 3 : 0);
    const stressHigh = stress >= 4, fatigueHigh = fatigue >= 4, moodLow = checkin.mood <= 2;
    let order = ['reaction', 'coordination', 'chimp', 'eye', 'flappy', 'logic'];
    if (fatigueHigh) {
      order = ['reaction', 'chimp', 'logic', 'eye', 'coordination', 'flappy'];
      reasons.push('😴 Zmęczenie lub za mało snu: na start test czujności (PVT, wydłużony do 7 prób) i pamięć, bo te funkcje najszybciej reagują na niedobór snu.');
    }
    if (stressHigh) {
      order = fatigueHigh ? ['reaction', 'logic', 'chimp', 'eye', 'coordination', 'flappy'] : ['logic', 'chimp', 'eye', 'coordination', 'reaction', 'flappy'];
      reasons.push(checkin.stress < 4 ? '💓 Tętno/HRV wskazują na podwyższony stres: zaczynamy od ćwiczenia oddechowego, a spokojniejsze zadania idą przed dynamicznymi.'
        : '😰 Wysoki stres: zaczynamy od ćwiczenia oddechowego, spokojniejsze zadania (logika, pamięć) idą przed dynamicznymi, a pilotaż na końcu.');
    }
    const weak = weakDomains(user);
    if (weak.length) {
      order = [...weak.filter(k => order.includes(k)), ...order.filter(k => !weak.includes(k))];
      reasons.push(`📉 Spadek względem Twoich poprzednich wyników (${weak.map(k => dn[k]).join(', ')}): te pokoje idą na początek, by zebrać dokładniejsze dane.`);
    }
    if (stressHigh) order = [...order.filter(k => k !== 'flappy'), 'flappy'];
    const plan = stressHigh ? ['calm_breath', ...order] : [...order];
    if (moodLow && !stressHigh) { plan.push('calm_ground'); reasons.push('🌧 Niski nastrój: na koniec krótkie ćwiczenie uziemiające 5-4-3-2-1.'); }
    if (!reasons.length) reasons.push('✅ Wskaźniki w normie: standardowa kolejność misji.');
    return { plan, reasons, warnings: f.warnings, flags: { stress, fatigue, stressHigh, fatigueHigh, moodLow }, weak };
  }

        const f = e.target.files[0]; if (!f) return; const rd = new FileReader();
        rd.onload = () => { try {
          const inc = JSON.parse(rd.result); const arr = Array.isArray(inc) ? inc : inc.sessions; if (!Array.isArray(arr)) throw 0;
          const have = new Set(DB.sessions.map(x => x.id)); const add = arr.filter(x => x && x.id && x.composite != null && x.chimp && x.flappy && !have.has(x.id));
          DB.sessions = DB.sessions.concat(add); if (inc.profiles) Object.keys(inc.profiles).forEach(k => { if (!DB.profiles[k]) DB.profiles[k] = inc.profiles[k]; });
          saveDB(); alert('Zaimportowano sesji: ' + add.length); viewData();
        } catch (err) { alert('Nieprawidłowy plik JSON (wymagany format v2).'); } };
        rd.readAsText(f);
      };
    }

    go('mission');
  }

  window.AstroCognition = { mount, getSessions, getRanking, exportJSON, exportCSV, onSaved: cb => listeners.push(cb), setVitals, getVitals: () => VITALS, setRequiredMeasurements, getRequiredMeasurements: () => REQ.slice(), planMission, getOrders, getRewards, setRewards, onOrder: cb => orderListeners.push(cb), duckFor, duckURL, DUCKS };
  const host = document.getElementById('astro-cognition-game');
  if (host) mount(host);
})();
